name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cmake-args: ""
          - os: windows-latest
            cmake-args: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Boost (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev

      - name: Install Boost (Windows)
        if: runner.os == 'Windows'
        run: choco install boost-msvc-14.3 --no-progress -y

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-args }}

      - name: Build
        run: cmake --build build --config Release --target cppplace_server cppplace_tests

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure -R cppplace_tests
